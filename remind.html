                <div class="sidebar-block developer-profile"><img class="profile-avatar" src="Charlotte.jpg"><h3 class="profile-name">Charlotte</h3><p class="profile-signature">「 哪怕是虚幻的世界，这份感情也是真实的。」</p>
                    
                    <button id="dark-mode-btn" class="dark-mode-toggle">
                    <i class="fa-solid fa-moon"></i> Link Start
                    </button>

                </div>
            </aside>

            <main id="magic-screen" class="content-area">
                <header class="article-header" style="margin-bottom: 20px;"><h1 class="main-title" style="margin: 0; text-align: left;"><i class="fa-solid fa-clock-rotate-left"></i> 大概能想起来的备忘录</h1></header>
                <div class="remind-container">
                    <div class="remind-left-panel">
                        <div class="anime-poster"><img src="https://t.alcy.cc/ycy"><div class="poster-mask"> remind</div></div>
                        <div class="remind-input-box glass-card">
                            <h3 style="margin-bottom: 15px; font-size: 16px; color: var(--theme-pink);">✨ 新增倒数/备忘</h3>
                            <textarea id="remind-text" placeholder="比如：明天要早起..." rows="3"></textarea>
                            <label style="font-size: 13px; color: var(--text-light); margin-bottom: 5px; display: block;">目标时间：</label>
                            <input type="datetime-local" id="remind-time" class="wa-comment-input" style="width: 100%; margin-bottom: 15px;">
                            <div id="remind-img-preview-box" style="display: none; position: relative; margin-bottom: 10px;">
                                <img id="remind-img-preview" style="width: 100%; border-radius: 8px;"><button id="remind-remove-img" class="wa-delete-btn" style="position: absolute; top: 5px; right: 5px; background: rgba(255,255,255,0.8); border-radius: 50%;"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <input type="file" id="remind-file-input" accept="image/*" style="display: none;">
                                <label for="remind-file-input" class="anime-btn" style="padding: 6px 12px; border: 1px solid var(--theme-blue); color: var(--theme-blue); border-radius: 6px;"><i class="fa-solid fa-image"></i> 传图</label>
                                <button id="remind-submit-btn" class="anime-btn confirm" style="padding: 6px 20px; border-radius: 6px;">记下来</button>
                            </div>
                        </div>
                    </div>
                    <div class="remind-right-panel" id="remind-list"></div>
                </div>

                <div id="remind-confirm-modal" class="anime-modal-overlay">
                    <div class="anime-modal-box"><div class="anime-modal-header">✨ 提示 ✨</div><div class="anime-modal-body" style="padding: 30px 20px;">确定要抹去这个重要时刻的记录吗？(。>︿<)</div><div class="anime-modal-footer"><button id="remind-modal-cancel" class="anime-btn cancel">手滑了</button><button id="remind-modal-confirm" class="anime-btn confirm">狠心删除</button></div></div>
                </div>
            </main>
        </div>
    </div>

    <div id="fps-box" class="fps-box">FPS: -- (≧∇≦)ﾉ</div>
    <div id="global-player" class="global-player collapsed"><div class="player-toggle" id="player-toggle"><img id="player-cover" src="https://picsum.photos/100" class="record-spin"><div class="player-sleeve"><div class="record-center"></div></div><div class="toggle-arrow"><i class="fa-solid fa-chevron-right"></i></div></div><div class="player-panel"><div class="player-info"><div class="player-title" id="player-title">等待载入...</div><div class="player-artist" id="player-artist">Asuna</div><div class="player-controls"><button id="btn-prev"><i class="fa-solid fa-backward-step"></i></button><button id="btn-play" class="play-btn-main"><i class="fa-solid fa-play"></i></button><button id="btn-next"><i class="fa-solid fa-forward-step"></i></button></div></div><ul class="playlist" id="playlist"></ul></div><audio id="bg-music"></audio></div>
    <div id="live2d-container" class="live2d-container"><canvas id="live2d-canvas"></canvas></div>

    <script src="https://unpkg.com/pixi.js@6.5.2/dist/browser/pixi.min.js"></script>

    <script src="https://unpkg.com/pixi-live2d-display@0.4.0/dist/cubism2.min.js"></script>
    <script src="music/playlist.js"></script>
    <script src="script.js"></script>
