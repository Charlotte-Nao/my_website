<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用于测试</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif; /* 设置字体 */
            margin: 50px auto; /* 让内容在屏幕中间 */
            max-width: 700px; /* 限制网页最大宽度，阅读起来更舒服 */
            line-height: 1.8; /* 行间距 */
            color: #333; /* 文字颜色：深灰色 */
            background-color: #fcfcfc; /* 页面背景色：非常淡的浅灰白 */
        }
        h1 {
            color: #2c3e50; /* 标题颜色 */
            border-bottom: 2px solid #eee; /* 标题下面加一条浅色横线 */
            padding-bottom: 10px;
        }
        .highlight {
            background-color: #ffe0b2; /* 给文字加个橙色荧光笔背景 */
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>这是h1 👋</h1>
    <p>欢迎来到我的个人主页！你现在看到的，是我完全从零开始、一行行代码搭起来的专属领地。</p>

    <h3>这是h3</h3>
    <p>第一天，被干炸毛了</p>

    <h3>🔬 我的折腾记录</h3>
    <ul>
        <li><span class="highlight">媒体观察</span>：喜欢拆解优秀慢综艺的叙事逻辑与价值建构。</li>
        <li><span class="highlight">跨界探索</span>：偶尔也会写写代码、跑跑 OpenCV，感受硬核技术的乐趣。</li>
    </ul>

    <p>这只是一个开始，以后我会在这里放满我喜欢的东西。</p>
</body>
</html>
