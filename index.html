<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 我的数字日记本 | 私人记忆空间</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #6d5dfc;
            --primary-light: #8b80f9;
            --secondary: #ff9a76;
            --accent: #4cc9f0;
            --light: #f8f9fa;
            --dark: #343a40;
            --gray: #6c757d;
            --success: #38b000;
            --danger: #e63946;
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #273e6e 100%);
            color: var(--dark);
            min-height: 100vh;
            line-height: 1.6;
            padding: 20px;
            transition: var(--transition);
        }

        body.dark-theme {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e9ecef;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 头部 */
        header {
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            color: white;
            border-radius: var(--radius);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: white;
            color: var(--primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* 主内容 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* 卡片 */
        .card {
            background: white;
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .dark-theme .card {
            background: #2d3748;
        }

        .card:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .dark-theme .card-header {
            border-bottom-color: #4a5568;
        }

        .card-title {
            font-size: 1.3rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 输入区域 */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }

        .dark-theme .input-group input,
        .dark-theme .input-group textarea {
            background: #4a5568;
            border-color: #718096;
            color: #e9ecef;
        }

        .input-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(109, 93, 252, 0.1);
        }

        /* 图片上传 */
        .image-upload {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            cursor: pointer;
            transition: var(--transition);
        }

        .image-upload:hover {
            border-color: var(--primary);
            background: #f8f9fa;
        }

        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .preview-item {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 6px;
            overflow: hidden;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-img {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }

        /* 日记列表 */
        .diary-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .diary-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 3px solid var(--primary);
        }

        .dark-theme .diary-item {
            background: #4a5568;
        }

        .diary-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .diary-title {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .diary-date {
            color: var(--gray);
            font-size: 0.85rem;
        }

        .diary-content {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .diary-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .edit-btn {
            background: rgba(76, 201, 240, 0.1);
            color: var(--accent);
        }

        .delete-btn {
            background: rgba(230, 57, 70, 0.1);
            color: var(--danger);
        }

        /* 备忘录 */
        .memo-list {
            list-style: none;
        }

        .memo-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .dark-theme .memo-item {
            background: #4a5568;
        }

        .memo-checkbox {
            margin-right: 10px;
        }

        .memo-text {
            flex: 1;
        }

        .memo-text.completed {
            text-decoration: line-through;
            color: var(--gray);
        }

        /* 图片库 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .gallery-item {
            border-radius: 6px;
            overflow: hidden;
            height: 100px;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 底部 */
        footer {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            color: var(--gray);
        }

        .dark-theme footer {
            background: #2d3748;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        .dark-theme .modal-content {
            background: #2d3748;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .dark-theme ::-webkit-scrollbar-thumb {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-book-open"></i> 我的数字日记本</h1>
            <p class="tagline">记录生活点滴，珍藏美好瞬间</p>
            
            <div class="controls">
                <button class="btn btn-primary" id="themeToggle">
                    <i class="fas fa-moon"></i> 切换主题
                </button>
                <button class="btn btn-secondary" id="clearAllBtn">
                    <i class="fas fa-trash"></i> 清空数据
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- 左侧 -->
            <div class="left-column">
                <!-- 写日记 -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title"><i class="fas fa-pen"></i> 写日记</h2>
                        <span id="currentDate" class="diary-date"></span>
                    </div>
                    
                    <div class="diary-input">
                        <div class="input-group">
                            <label for="diaryTitle">标题</label>
                            <input type="text" id="diaryTitle" placeholder="今天发生了什么？">
                        </div>
                        
                        <div class="input-group">
                            <label for="diaryContent">内容</label>
                            <textarea id="diaryContent" placeholder="写下你的心情和想法..."></textarea>
                        </div>
                        
                        <div class="input-group">
                            <label>添加图片</label>
                            <div class="image-upload" id="imageUploadArea">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>点击或拖拽图片上传</p>
                                <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                            </div>
                            <div class="image-preview" id="imagePreview"></div>
                        </div>
                        
                        <div style="text-align: right;">
                            <button class="btn btn-primary" id="saveDiaryBtn">
                                <i class="fas fa-save"></i> 保存日记
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 备忘录 -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title"><i class="fas fa-tasks"></i> 备忘录</h2>
                    </div>
                    
                    <div class="memo-input">
                        <div class="input-group">
                            <input type="text" id="memoInput" placeholder="添加新事项...">
                        </div>
                    </div>
                    
                    <ul class="memo-list" id="memoList"></ul>
                </div>
            </div>
            
            <!-- 右侧 -->
            <div class="right-column">
                <!-- 日记记录 -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title"><i class="fas fa-history"></i> 日记记录</h2>
                    </div>
                    
                    <div class="diary-list" id="diaryList"></div>
                </div>
                
                <!-- 图片库 -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title"><i class="fas fa-images"></i> 图片库</h2>
                        <span id="imageCount">0 张</span>
                    </div>
                    
                    <div class="gallery" id="imageGallery"></div>
                </div>
            </div>
        </div>
        
        <!-- 底部 -->
        <footer>
            <h3>我的记忆统计</h3>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalDiaries">0</div>
                    <div>篇日记</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalImages">0</div>
                    <div>张图片</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalMemos">0</div>
                    <div>条备忘录</div>
                </div>
            </div>
            <p style="margin-top: 10px; font-size: 0.9rem;">数据存储在本地浏览器中</p>
        </footer>
    </div>
    
    <!-- 图片查看模态框 -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">&times;</button>
            <img id="modalImage" style="width: 100%; border-radius: 8px; margin: 10px 0;">
            <div id="modalInfo"></div>
        </div>
    </div>

    <script>
        // 数据存储
        let diaries = JSON.parse(localStorage.getItem('myDiaries')) || [];
        let memos = JSON.parse(localStorage.getItem('myMemos')) || [];
        let currentImages = [];
        
        // DOM元素
        const themeToggle = document.getElementById('themeToggle');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const currentDateEl = document.getElementById('currentDate');
        const diaryTitle = document.getElementById('diaryTitle');
        const diaryContent = document.getElementById('diaryContent');
        const imageUploadArea = document.getElementById('imageUploadArea');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const saveDiaryBtn = document.getElementById('saveDiaryBtn');
        const memoInput = document.getElementById('memoInput');
        const memoList = document.getElementById('memoList');
        const diaryList = document.getElementById('diaryList');
        const imageGallery = document.getElementById('imageGallery');
        const imageCount = document.getElementById('imageCount');
        const totalDiaries = document.getElementById('totalDiaries');
        const totalImages = document.getElementById('totalImages');
        const totalMemos = document.getElementById('totalMemos');
        const imageModal = document.getElementById('imageModal');
        const closeModal = document.getElementById('closeModal');
        const modalImage = document.getElementById('modalImage');
        const modalInfo = document.getElementById('modalInfo');
        
        // 初始化
        function init() {
            updateCurrentDate();
            renderDiaries();
            renderMemos();
            renderImageGallery();
            updateStats();
            
            // 事件监听
            themeToggle.addEventListener('click', toggleTheme);
            clearAllBtn.addEventListener('click', clearAllData);
            saveDiaryBtn.addEventListener('click', saveDiary);
            imageUploadArea.addEventListener('click', () => imageInput.click());
            imageInput.addEventListener('change', handleImageUpload);
            closeModal.addEventListener('click', () => imageModal.style.display = 'none');
            
            // 备忘录输入框回车键
            memoInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addMemo();
                }
            });
            
            // 拖拽上传
            imageUploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                imageUploadArea.style.borderColor = 'var(--primary)';
            });
            
            imageUploadArea.addEventListener('dragleave', () => {
                imageUploadArea.style.borderColor = '';
            });
            
            imageUploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                imageUploadArea.style.borderColor = '';
                if (e.dataTransfer.files.length) {
                    imageInput.files = e.dataTransfer.files;
                    handleImageUpload();
                }
            });
            
            // 点击模态框外部关闭
            imageModal.addEventListener('click', (e) => {
                if (e.target === imageModal) {
                    imageModal.style.display = 'none';
                }
            });
        }
        
        // 更新当前日期
        function updateCurrentDate() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            });
            currentDateEl.textContent = dateStr;
        }
        
        // 切换主题
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const icon = themeToggle.querySelector('i');
            if (document.body.classList.contains('dark-theme')) {
                icon.className = 'fas fa-sun';
                themeToggle.innerHTML = '<i class="fas fa-sun"></i> 切换主题';
            } else {
                icon.className = 'fas fa-moon';
                themeToggle.innerHTML = '<i class="fas fa-moon"></i> 切换主题';
            }
        }
        
        // 处理图片上传
        function handleImageUpload() {
            const files = imageInput.files;
            currentImages = [];
            imagePreview.innerHTML = '';
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    currentImages.push(e.target.result);
                    
                    // 创建预览
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.alt = '预览图片';
                    
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-img';
                    removeBtn.innerHTML = '×';
                    removeBtn.onclick = function() {
                        previewItem.remove();
                        const index = currentImages.indexOf(e.target.result);
                        if (index > -1) currentImages.splice(index, 1);
                    };
                    
                    previewItem.appendChild(img);
                    previewItem.appendChild(removeBtn);
                    imagePreview.appendChild(previewItem);
                };
                
                reader.readAsDataURL(file);
            }
        }
        
        // 保存日记
        function saveDiary() {
            const title = diaryTitle.value.trim();
            const content = diaryContent.value.trim();
            
            if (!title && !content) {
                alert('请至少填写标题或内容');
                return;
            }
            
            const diary = {
                id: Date.now(),
                title: title || '无标题日记',
                content,
                images: [...currentImages],
                date: new Date().toLocaleString('zh-CN')
            };
            
            diaries.unshift(diary); // 添加到开头
            localStorage.setItem('myDiaries', JSON.stringify(diaries));
            
            // 清空表单
            diaryTitle.value = '';
            diaryContent.value = '';
            currentImages = [];
            imagePreview.innerHTML = '';
            imageInput.value = '';
            
            // 更新显示
            renderDiaries();
            renderImageGallery();
            updateStats();
            
            alert('日记保存成功！');
        }
        
        // 渲染日记列表
        function renderDiaries() {
            diaryList.innerHTML = '';
            
            if (diaries.length === 0) {
                diaryList.innerHTML = '<p style="text-align: center; color: var(--gray);">还没有日记，开始记录吧！</p>';
                return;
            }
            
            diaries.forEach(diary => {
                const diaryItem = document.createElement('div');
                diaryItem.className = 'diary-item';
                diaryItem.dataset.id = diary.id;
                
                let imagesHtml = '';
                if (diary.images && diary.images.length > 0) {
                    imagesHtml = '<div style="display: flex; gap: 5px; margin-top: 10px;">';
                    diary.images.forEach((img, index) => {
                        imagesHtml += `<img src="${img}" alt="日记图片" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px; cursor: pointer;" onclick="viewImage('${img}', '${diary.title}')">`;
                    });
                    imagesHtml += '</div>';
                }
                
                diaryItem.innerHTML = `
                    <div class="diary-header">
                        <div class="diary-title">${diary.title}</div>
                        <div class="diary-date">${diary.date}</div>
                    </div>
                    <div class="diary-content">${diary.content || '（无内容）'}</div>
                    ${imagesHtml}
                    <div class="diary-actions">
                        <button class="action-btn edit-btn" onclick="editDiary(${diary.id})">
                            <i class="fas fa-edit"></i> 编辑
                        </button>
                        <button class="action-btn delete-btn" onclick="deleteDiary(${diary.id})">
                            <i class="fas fa-trash"></i> 删除
                        </button>
                    </div>
                `;
                
                diaryList.appendChild(diaryItem);
            });
        }
        
        // 编辑日记
        function editDiary(id) {
            const diary = diaries.find(d => d.id === id);
            if (!diary) return;
            
            diaryTitle.value = diary.title;
            diaryContent.value = diary.content;
            currentImages = [...diary.images];
            
            // 更新预览
            imagePreview.innerHTML = '';
            currentImages.forEach(img => {
                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';
                
                const imgEl = document.createElement('img');
                imgEl.src = img;
                imgEl.alt = '预览图片';
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-img';
                removeBtn.innerHTML = '×';
                removeBtn.onclick = function() {
                    previewItem.remove();
                    const index = currentImages.indexOf(img);
                    if (index > -1) currentImages.splice(index, 1);
                };
                
                previewItem.appendChild(imgEl);
                previewItem.appendChild(removeBtn);
                imagePreview.appendChild(previewItem);
            });
            
            // 删除原日记
            deleteDiary(id, false);
            
            // 滚动到顶部
            window.scrollTo(0, 0);
        }
        
        // 删除日记
        function deleteDiary(id, confirm = true) {
            if (confirm && !window.confirm('确定要删除这篇日记吗？')) return;
            
            diaries = diaries.filter(d => d.id !== id);
            localStorage.setItem('myDiaries', JSON.stringify(diaries));
            renderDiaries();
            renderImageGallery();
            updateStats();
        }
        
        // 添加备忘录
        function addMemo() {
            const text = memoInput.value.trim();
            if (!text) return;
            
            const memo = {
                id: Date.now(),
                text,
                completed: false,
                date: new Date().toLocaleDateString('zh-CN')
            };
            
            memos.unshift(memo);
            localStorage.setItem('myMemos', JSON.stringify(memos));
            memoInput.value = '';
            renderMemos();
            updateStats();
        }
        
        // 渲染备忘录
        function renderMemos() {
            memoList.innerHTML = '';
            
            if (memos.length === 0) {
                memoList.innerHTML = '<p style="text-align: center; color: var(--gray);">还没有备忘录</p>';
                return;
            }
            
            memos.forEach(memo => {
                const memoItem = document.createElement('li');
                memoItem.className = 'memo-item';
                
                memoItem.innerHTML = `
                    <input type="checkbox" class="memo-checkbox" ${memo.completed ? 'checked' : ''} onchange="toggleMemo(${memo.id})">
                    <span class="memo-text ${memo.completed ? 'completed' : ''}">${memo.text}</span>
                    <span style="font-size: 0.8rem; color: var(--gray); margin-left: auto;">${memo.date}</span>
                    <button style="background: none; border: none; color: var(--danger); margin-left: 10px; cursor: pointer;" onclick="deleteMemo(${memo.id})">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                
                memoList.appendChild(memoItem);
            });
        }
        
        // 切换备忘录完成状态
        function toggleMemo(id) {
            const memo = memos.find(m => m.id === id);
            if (memo) {
                memo.completed = !memo.completed;
                localStorage.setItem('myMemos', JSON.stringify(memos));
                renderMemos();
                updateStats();
            }
        }
        
        // 删除备忘录
        function deleteMemo(id) {
            memos = memos.filter(m => m.id !== id);
            localStorage.setItem('myMemos', JSON.stringify(memos));
            renderMemos();
            updateStats();
        }
        
        // 渲染图片库
        function renderImageGallery() {
            imageGallery.innerHTML = '';
            
            let allImages = [];
            diaries.forEach(diary => {
                if (diary.images && diary.images.length > 0) {
                    diary.images.forEach(img => {
                        allImages.push({
                            src: img,
                            title: diary.title,
                            date: diary.date
                        });
                    });
                }
            });
            
            imageCount.textContent = `${allImages.length} 张`;
            
            if (allImages.length === 0) {
                imageGallery.innerHTML = '<p style="text-align: center; color: var(--gray);">还没有图片</p>';
                return;
            }
            
            allImages.forEach(img => {
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';
                galleryItem.onclick = () => viewImage(img.src, img.title, img.date);
                
                const imgEl = document.createElement('img');
                imgEl.src = img.src;
                imgEl.alt = '日记图片';
                
                galleryItem.appendChild(imgEl);
                imageGallery.appendChild(galleryItem);
            });
        }
        
        // 查看图片
        function viewImage(src, title, date) {
            modalImage.src = src;
            modalInfo.innerHTML = `
                <p><strong>标题:</strong> ${title || '未命名'}</p>
                ${date ? `<p><strong>日期:</strong> ${date}</p>` : ''}
            `;
            imageModal.style.display = 'flex';
        }
        
        // 更新统计
        function updateStats() {
            totalDiaries.textContent = diaries.length;
            
            let imageCount = 0;
            diaries.forEach(diary => {
                if (diary.images) imageCount += diary.images.length;
            });
            totalImages.textContent = imageCount;
            
            totalMemos.textContent = memos.length;
        }
        
        // 清空所有数据
        function clearAllData() {
            if (!confirm('确定要清空所有数据吗？此操作不可撤销！')) return;
            
            diaries = [];
            memos = [];
            localStorage.removeItem('myDiaries');
            localStorage.removeItem('myMemos');
            
            renderDiaries();
            renderMemos();
            renderImageGallery();
            updateStats();
            
            alert('所有数据已清空');
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
