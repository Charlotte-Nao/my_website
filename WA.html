<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLA - Blue Rose Archive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="main-container">
            <aside class="sidebar">
                <div class="sidebar-block">
                    <div class="sidebar-header"><h1 style="font-size: 32px; letter-spacing: 2px;">FLA</h1><p style="font-size: 13px; opacity: 0.8;">Blue Rose System</p></div>
                    <nav class="sidebar-menu" style="padding: 15px 10px;">
                        <ul>
                            <li class="active"><a href="WA.html"><i class="fa-solid fa-droplet"></i> WA</a></li>
                            <li><a href="schedule.html"><i class="fa-solid fa-calendar-days"></i> 课表</a></li>
                            <li><a href="remind.html"><i class="fa-solid fa-note-sticky"></i> 备忘</a></li>
                            <li><a href="index.html"><i class="fa-solid fa-home"></i> 首页</a></li>
                            <li><a href="archive.html"><i class="fa-solid fa-box-archive"></i> 归档</a><span class="badge">147</span></li>
                            <li><a href="label.html"><i class="fa-solid fa-tags"></i> 标签</a><span class="badge">246</span></li>
                            <li><a href="#"><i class="fa-solid fa-folder"></i> 分类</a><span class="badge">10</span></li>
                            <li><a href="left.html"><i class="fa-solid fa-comment"></i> 留言</a></li>
                            <li><a href="#"><i class="fa-solid fa-link"></i> 友链</a></li>
                            <li><a href="about.html"><i class="fa-solid fa-info-circle"></i> 关于</a></li>
                        </ul>
                    </nav>
                </div>
                <div class="sidebar-block developer-profile">
                    <img class="profile-avatar" src="Charlotte.jpg" alt="Avatar">
                    <h3 class="profile-name">Charlotte</h3><p class="profile-signature">「 哪怕是虚幻的世界，这份感情也是真实的。」</p>
                    
                    <button id="dark-mode-btn" class="dark-mode-toggle">
                    <i class="fa-solid fa-moon"></i> Link Start
                    </button>

                </div>
                <div class="sidebar-block sidebar-links-section">
                    <div class="links-title"><i class="fa-solid fa-globe"></i> 传送门</div>
                    <ul class="sidebar-links-list">
                        <li><a href="https://github.com/ryanhanwu/How-To-Ask-Questions-The-Smart-Way/blob/main/README-zh_CN.md" target="_blank">提问的智慧</a></li>
                    </ul>
                </div>
            </aside>

            <main id="magic-screen" class="content-area">
                <header class="article-header"><h1 class="main-title" style="text-align: left; margin-bottom: 20px;">WA / 流水账</h1></header>
                <div class="wa-editor-box">
                    <textarea id="wa-textarea" placeholder="今天发生了什么？写下你的流水账..."></textarea>
                    <div id="wa-image-preview-container" style="display: none;">
                        <img id="wa-image-preview" src="" alt="预览图"><button id="wa-remove-image"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    
                    <div id="wa-sync-gallery-wrapper" style="display: none; margin-bottom: 15px; padding-top: 10px; border-top: 1px dashed var(--glass-border);">
                        <label style="color: var(--text-light); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="wa-sync-gallery-checkbox" style="accent-color: var(--theme-blue); width: 16px; height: 16px;">
                            <b>同步收录到「记忆碎片」相册</b>
                        </label>
                        <input type="text" id="wa-sync-gallery-caption" class="wa-comment-input" style="display: none; width: 100%; border: none; border-bottom: 1px solid var(--theme-blue); border-radius: 0; padding: 10px 5px; margin-top: 10px; font-size: 14px; background: transparent;" placeholder="为这张照片写下一句专属回忆（不填则默认使用WA正文）...">
                    </div>

                    <div class="wa-editor-tools">
                        <div class="wa-tools-left">
                            <input type="file" id="wa-image-input" accept="image/*" style="display: none;">
                            <label for="wa-image-input" class="wa-tool-btn"><i class="fa-solid fa-image"></i> 选图</label>
                        </div>
                        <div class="wa-tools-right">
                            <span class="wa-meta-info"><i class="fa-regular fa-clock"></i> <span id="wa-current-time">00:00:00</span><span style="margin: 0 10px;">|</span>字数: <span id="wa-word-count">0</span></span>
                            <button id="wa-submit-btn">发布记录</button>
                        </div>
                    </div>
                </div>
                <div id="wa-feed"></div>

                <div id="custom-confirm-modal" class="anime-modal-overlay">
                    <div class="anime-modal-box">
                        <div class="anime-modal-header">✨ 提示 ✨</div>
                        <div class="anime-modal-body" id="anime-modal-msg">确定要删除这条记录吗？不可恢复哦~ (；′⌒`)</div>
                        <div class="anime-modal-footer">
                            <button id="modal-cancel-btn" class="anime-btn cancel">算啦</button>
                            <button id="modal-confirm-btn" class="anime-btn confirm">狠心删除</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="fps-box" class="fps-box">FPS: -- (≧∇≦)ﾉ</div>
    <div id="global-player" class="global-player collapsed"><div class="player-toggle" id="player-toggle"><img id="player-cover" src="https://picsum.photos/100" class="record-spin"><div class="player-sleeve"><div class="record-center"></div></div><div class="toggle-arrow"><i class="fa-solid fa-chevron-right"></i></div></div><div class="player-panel"><div class="player-info"><div class="player-title" id="player-title">等待载入...</div><div class="player-artist" id="player-artist">Asuna</div><div class="player-controls"><button id="btn-prev"><i class="fa-solid fa-backward-step"></i></button><button id="btn-play" class="play-btn-main"><i class="fa-solid fa-play"></i></button><button id="btn-next"><i class="fa-solid fa-forward-step"></i></button></div></div><ul class="playlist" id="playlist"></ul></div><audio id="bg-music"></audio></div>
    <div id="live2d-container" class="live2d-container"><canvas id="live2d-canvas"></canvas></div>

    <script src="https://unpkg.com/pixi.js@6.5.2/dist/browser/pixi.min.js"></script>
    <script src="https://fastly.jsdelivr.net/gh/dylanNew/live2d/webgl/Live2D/lib/live2d.min.js"></script>
    <script src="https://unpkg.com/pixi-live2d-display@0.4.0/dist/cubism2.min.js"></script>
    <script src="music/playlist.js"></script>
    <script src="script.js"></script>
</body>
</html>
