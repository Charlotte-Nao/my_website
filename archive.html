<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>归档 - Blue Rose Archive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="main-container">
            <aside class="sidebar">
                <div class="sidebar-block">
                    <div class="sidebar-header">
                        <h1 style="font-size: 32px; letter-spacing: 2px;">FLA</h1>
                        <p style="font-size: 13px; opacity: 0.8;">Blue Rose System</p>
                    </div>
                    <nav class="sidebar-menu" style="padding: 15px 10px;">
                        <ul>
                        <li><a href="WA.html"><i class="fa-solid fa-droplet"></i> WA</a></li>
                        <li><a href="schedule.html"><i class="fa-solid fa-calendar-days"></i> 课表</a></li>
                        <li><a href="remind.html"><i class="fa-solid fa-note-sticky"></i> 备忘</a></li>
                        <li><a href="index.html"><i class="fa-solid fa-home"></i> 首页</a></li>
                        <li class="active"><a href="archive.html"><i class="fa-solid fa-box-archive"></i> 归档</a></li>
                        <li><a href="label.html"><i class="fa-solid fa-tags"></i> 标签</a></li>
                        <li><a href="#"><i class="fa-solid fa-folder"></i> 分类</a></li>
                        <li><a href="left.html"><i class="fa-solid fa-comment"></i> 留言</a></li>
                        <li><a href="#"><i class="fa-solid fa-link"></i> 友链</a></li>
                        <li><a href="about.html"><i class="fa-solid fa-info-circle"></i> 关于</a></li>
                        </ul>
                    </nav>
                </div>
                <div class="sidebar-block developer-profile">
                    <img class="profile-avatar" src="Charlotte.jpg" alt="Avatar">
                    <h3 class="profile-name">Charlotte</h3>
                    <p class="profile-signature">「 哪怕是虚幻的世界，这份感情也是真实的。」</p>
                    <button id="dark-mode-btn" class="dark-mode-toggle"><i class="fa-solid fa-moon"></i> Link Start</button>
                </div>
            </aside>

            <main id="magic-screen" class="content-area">
                <header class="article-header">
                    <h1 class="main-title"><i class="fa-solid fa-box-archive"></i> 记忆档案馆</h1>
                    <div class="sub-title">Anime / Galgame / Manga</div>
                </header>

                <div class="archive-editor-wrapper">
                    <button id="archive-toggle-editor" class="anime-btn confirm" style="width: 100%; margin-bottom: 20px; border-radius: 12px;"><i class="fa-solid fa-pen-nib"></i> 封存新的记忆</button>
                    
                        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                            <select id="arc-category" class="arc-input" style="width: 150px;">
                                <option value="番剧">📺 番剧</option>
                                <option value="Galgame">🎮 Galgame</option>
                                <option value="漫画">📖 漫画</option>
                            </select>
                            <input type="text" id="arc-title" class="arc-input" placeholder="作品标题..." style="flex: 2;">
                            <input type="text" id="arc-play-time" class="arc-input" placeholder="起止时间 (例: 2026.1 - 2026.2)" style="flex: 2;">
                        </div>
                        
                        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                            <label class="anime-btn" style="flex: 1; text-align: center; border-radius: 8px;">
                                <i class="fa-solid fa-image"></i> 上传主封面图 (必填)
                                <input type="file" id="arc-cover-input" accept="image/*" style="display: none;">
                            </label>
                            <label class="anime-btn" style="flex: 1; text-align: center; border-radius: 8px;">
                                <i class="fa-solid fa-images"></i> 添加额外截图 (多选)
                                <input type="file" id="arc-extra-input" accept="image/*" multiple style="display: none;">
                            </label>
                        </div>
                        
                        <div id="arc-preview-area" style="display: flex; gap: 10px; overflow-x: auto; margin-bottom: 15px;"></div>
                        
                        <textarea id="arc-review" class="arc-input" placeholder="写下你的游玩/观影评价..." style="height: 150px; resize: vertical; margin-bottom: 15px; width: 100%;"></textarea>
                        
                        <button id="arc-submit-btn" class="anime-btn confirm" style="width: 100%; border-radius: 8px;">发布归档</button>
                    </div>
                </div>

                <div class="archive-filters">
                    <button class="arc-filter-btn active" data-filter="all">全部</button>
                    <button class="arc-filter-btn" data-filter="番剧">番剧</button>
                    <button class="arc-filter-btn" data-filter="Galgame">Galgame</button>
                    <button class="arc-filter-btn" data-filter="漫画">漫画</button>
                </div>

                <div id="archive-grid" class="archive-grid">
                    </div>

                <div id="arc-detail-modal" class="anime-modal-overlay">
                    <div class="arc-detail-box">
                        <button id="arc-detail-close" class="arc-close-btn"><i class="fa-solid fa-xmark"></i></button>
                        <div class="arc-detail-layout">
                            <div class="arc-detail-left">
                                <img id="arc-detail-cover" src="" alt="Cover">
                                <div id="arc-detail-meta" class="arc-meta-info"></div>
                                <button id="arc-detail-delete" class="wa-delete-btn" style="width:100%; margin-top:15px; background: rgba(255,0,0,0.1); border-radius: 6px; padding: 8px;"><i class="fa-solid fa-trash-can"></i> 抹除此记录</button>
                            </div>
                            <div class="arc-detail-right">
                                <h2 id="arc-detail-title"></h2>
                                <div class="arc-divider"></div>
                                <div id="arc-detail-review" class="arc-review-text"></div>
                                <div id="arc-detail-extra-images" class="arc-extra-gallery"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>


</body>
</html>
